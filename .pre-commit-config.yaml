# Pre-commit hooks: Ejecutan automáticamente antes de git commit
# Setup: pip install pre-commit && pre-commit install

repos:
  # Verifica que no commitees secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline", "--allow-multiple-files"]

  # Formatea código automáticamente (Black)
  - repo: https://github.com/psf/black
    rev: 23.9.0
    hooks:
      - id: black
        language_version: python3.10
        args: ["--line-length=100"]

  # Organiza imports
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length", "100"]

  # Linting básico (fast checks)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--safe"]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: name-tests-test
        args: ["--django"]

  # Verificar tipos (mypy)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.0
    hooks:
      - id: mypy
        args: ["--ignore-missing-imports"]
        additional_dependencies: ["types-all"]
        files: ^src/

  # Pylint
  - repo: https://github.com/PyCQA/pylint
    rev: pylint-2.17.0
    hooks:
      - id: pylint
        args: ["--fail-under=8.0"]
        files: ^src/
        exclude: ^(docs|tests)/

ci:
  # Versión para CI/CD
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
